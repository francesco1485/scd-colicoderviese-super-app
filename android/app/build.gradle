plugins {
    id 'com.android.application'
}

android {
    namespace 'it.colicoderviese.app'
    compileSdk 36

    defaultConfig {
        applicationId 'it.colicoderviese.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
