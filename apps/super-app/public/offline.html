<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d1b3e" />
<title>Offline — SCD ColicoDerviese</title>
<link rel="icon" href="/favicon.png" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0d1b3e,#1b3a7a);color:#f5f7ff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .b{width:64px;height:64px;border-radius:50%;background:#f5c518;margin:0 auto 20px}
  h1{text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
  p{opacity:.8;max-width:320px;margin:0 auto 20px}
  button{background:#f5c518;color:#0d1b3e;border:0;border-radius:12px;padding:12px 20px;font-weight:700;text-transform:uppercase}
</style>
</head>
<body>
  <main>
    <div class="b"></div>
    <h1>Sei offline</h1>
    <p>Nessuna connessione. Le pagine già visitate restano disponibili; riprova appena torna la rete.</p>
    <button onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
