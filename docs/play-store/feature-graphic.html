<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BSD;src:url(bsd900.woff2)}@font-face{font-family:Fira;src:url(fira600.woff2)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.c{position:relative;width:1024px;height:500px;background:#062a66;color:#fff;font-family:Fira}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.g{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,26,70,.96) 0%,rgba(5,38,96,.82) 52%,rgba(6,42,102,.2) 100%)}
.s{position:absolute;left:-60px;top:-50px;width:230px;height:230px;transform:rotate(-35deg);background:repeating-linear-gradient(90deg,#ffd600 0 12px,transparent 12px 26px);opacity:.85}
.crest{position:absolute;left:56px;top:70px;height:170px}
.scd{position:absolute;left:206px;top:84px;font-family:BSD;font-size:30px;letter-spacing:6px;opacity:.9}
.name{position:absolute;left:200px;top:110px;font-family:BSD;font-size:96px;line-height:1;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.name b{color:#ffd600}
.tri{position:absolute;left:206px;top:214px;width:420px;height:7px;border-radius:4px;background:linear-gradient(90deg,#1f9d55 0 33%,#f4f6fa 33% 66%,#d62b33 66%)}
.slo{position:absolute;left:58px;top:270px;font-family:BSD;font-size:44px;font-style:italic;color:#ffd600;transform:rotate(-4deg);line-height:1.02}
.slo span{color:#fff}
.p{position:absolute;left:60px;top:400px;width:560px;font-size:21px;line-height:1.3;color:#eaf2ff}
.sky{position:absolute;right:28px;top:40px;height:560px}
</style></head><body><div class="c">
<img class="bg" src="hero-colico.webp"><div class="g"></div><div class="s"></div>
<img class="crest" src="logo-scd.webp"><div class="scd">S.C.D.</div>
<div class="name">Colico<b>derviese</b></div><div class="tri"></div>
<div class="slo">Sport · Persone · Territorio<br><span>Sempre insieme!</span></div>
<div class="p">Partite, allenamenti, convocazioni e vita del club in un'app.</div>
<img class="sky" src="sky-atv-cut.webp">
</div></body></html>
