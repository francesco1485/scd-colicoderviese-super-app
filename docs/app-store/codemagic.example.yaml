# Codemagic cloud build for the iOS Capacitor wrapper (no Mac needed).
# Copy to the repository root as `codemagic.yaml` ONLY when the Apple Developer account is active.
# Secrets never live here: the App Store Connect API key is stored in Codemagic
# (Team settings → Integrations → Developer Portal) under the name used in `integrations`.
# Capacitor 8 creates the iOS project with Swift Package Manager by default → ios/App/App.xcodeproj.
workflows:
  scd-ios-capacitor:
    name: SCD ColicoDerviese iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/superapp
    integrations:
      app_store_connect: SCD App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.colicoderviese.app
      vars:
        SCD_APP_ORIGIN: https://scd-superapp-staging.onrender.com
        APP_STORE_APPLE_ID: "0000000000" # numeric Apple ID of the app from App Store Connect → App information
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Install web dependencies
        script: npm ci --no-audit --no-fund
      - name: Create native iOS project (not committed) and sync config
        script: |
          if [ ! -d ios ]; then npm run cap:add:ios; fi
          npm run cap:sync
      - name: App icons from the official crest icon
        script: npm run cap:icons:ios
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
