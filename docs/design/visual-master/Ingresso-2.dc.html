<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Primo ingresso, scelta delle annate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#062a52}
a{color:#F8D000}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(180deg,#062a52 0%,#0860A8 60%,#062a52 100%);font-family:'Barlow',sans-serif;color:#ffffff">

<header style="padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;gap:6px" aria-label="Passo 2 di 2"><span style="width:28px;height:6px;border-radius:3px;background:#F8D000;display:block"></span><span style="width:28px;height:6px;border-radius:3px;background:#F8D000;display:block"></span></div>
<a href="Main.dc.html" style="font-size:15px;font-weight:600;color:#cfe6ff;text-decoration:none">Salta</a>
</header>

<section style="padding:22px 20px 0">
<h1 style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:36px;line-height:1">Chi sei?</h1>
<p style="margin:6px 0 0;font-size:15px;color:#cfe6ff">Ti mostriamo prima quello che ti serve.</p>
<div style="margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button aria-pressed="true" style="height:64px;border-radius:16px;border:2px solid #F8D000;background:rgba(248,208,0,.14);color:#ffffff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F8D000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/></svg>Genitore</button>
<button aria-pressed="false" style="height:64px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#ffffff;font-weight:600;font-size:16px">Tifoso</button>
<button aria-pressed="false" style="height:64px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#ffffff;font-weight:600;font-size:16px">Atleta</button>
<button aria-pressed="false" style="height:64px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#ffffff;font-weight:600;font-size:16px">Staff del club</button>
</div>
</section>

<section style="padding:24px 20px 0">
<h2 style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;line-height:1">Quali annate segui?</h2>
<p style="margin:6px 0 0;font-size:15px;color:#cfe6ff">Puoi sceglierne più di una.</p>
<div style="margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{teams}}" as="t" hint-placeholder-count="9">
<button aria-pressed="{{t.on}}" style="height:76px;border-radius:14px;border:{{t.border}};background:{{t.bg}};color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer">
<span style="width:36px;height:30px;border-radius:7px;transform:skewX(-8deg);background:{{t.c}};display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:14px">{{t.code}}</span>
<span style="font-size:12.5px;font-weight:600">{{t.name}}</span>
</button>
</sc-for>
</div>
</section>

<section style="position:absolute;left:20px;right:20px;bottom:26px">
<a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;background:#F8D000;color:#062a52;font-weight:700;font-size:18px;text-decoration:none">Entra nella SCD</a>
<p style="margin:10px 0 0;text-align:center;font-size:13px;color:#9fb6d9">Nessun accesso richiesto. Il profilo serve solo per le aree personali.</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [['1ª', 'Prima', '#AD7616', false], ['U19', 'Juniores', '#375B89', false], ['U16', 'Under 16', '#C85D22', false], ['U15', 'Under 15', '#C23C3F', true], ['E14', 'Esord. 2014', '#7654B8', false], ['E15', 'Esord. 2015', '#148B99', false], ['PUL', 'Pulcini', '#3269BC', true], ['PC', 'Primi Calci', '#568C23', false], ['PA', 'Piccoli Amici', '#2A9CB7', false]];
    return { teams: list.map(([code, name, c, on]) => ({ code, name, c, on, border: on ? '2px solid #F8D000' : '1px solid rgba(255,255,255,.18)', bg: on ? 'rgba(248,208,0,.14)' : 'rgba(255,255,255,.05)' })) };
  }
}
</script>
</body>
</html>
