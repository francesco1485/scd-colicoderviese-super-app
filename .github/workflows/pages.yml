name: Deploy SCD Super App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/assets
          cp index.html styles.css app.js manifest.webmanifest sw.js _site/
          cp -R assets/* _site/assets/

          # GitHub Pages project sites live under /<repo>/, so use relative assets.
          sed -i 's|href="/styles.css|href="./styles.css|g' _site/index.html
          sed -i 's|src="/app.js|src="./app.js|g' _site/index.html
          sed -i 's|href="/manifest.webmanifest"|href="./manifest.webmanifest"|g' _site/index.html
          sed -i 's|href="/assets/|href="./assets/|g' _site/index.html
          sed -i 's|src="/assets/|src="./assets/|g' _site/index.html
          sed -i "s|'/assets/|'./assets/|g" _site/app.js
          sed -i 's|"/assets/|"./assets/|g' _site/app.js
          sed -i "s|url('/assets/|url('./assets/|g" _site/styles.css
          sed -i 's|url("/assets/|url("./assets/|g' _site/styles.css

          # Disable SW on the GitHub Pages mirror to avoid path/cache conflicts.
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/app.js')
          s=p.read_text()
          s=s.replace("if('serviceWorker' in navigator){\n  navigator.serviceWorker.register('/sw.js?v=21.4.3',{updateViaCache:'none'})\n    .then(reg=>reg.update())\n    .catch(()=>{});\n}", "")
          s=s.replace("if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});", "")
          p.write_text(s)
          PY

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
