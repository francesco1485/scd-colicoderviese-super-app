name: Deploy SCD Super App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SCD System Manifest gate
        run: npm run test:manifest

      - name: Operative Core contract gate
        run: npm run test:operative-core

      - name: Social App contract gate
        run: npm run test:social-app

      - name: R53 football/social core gate
        run: npm run test:r53-core

      - name: R54 private experience gate
        run: npm run test:r54-private

      - name: R53 football/social core gate
        run: npm run test:r53-core

      - name: Prepare static site
        run: |
          node --check app.js
          node --check app-r24-router.js
          node --check server.js
          npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
