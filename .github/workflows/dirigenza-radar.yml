name: SCD Direction Radar Daily

on:
  push:
    branches: ["feat/dirigenza-radar-v1"]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

concurrency:
  group: scd-direction-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate radar contract
        run: npm run test:dirigenza-radar
      - name: Diagnose official Colico upstream transport
        run: node scripts/probe-colico-transport.mjs
      - name: Refresh staged discovery and source health
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'data: refresh direction radar discovery'))
        run: node scripts/update-dirigenza-radar.mjs
      - name: Validate refreshed radar snapshot
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'data: refresh direction radar discovery'))
        run: npm run test:dirigenza-radar
      - name: Commit staged discovery delta
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'data: refresh direction radar discovery'))
        shell: bash
        run: |
          if git diff --quiet -- data/scd-dirigenza-radar.snapshot.json; then
            echo "No Radar changes"
            exit 0
          fi
          git config user.name "SCD Direction Radar"
          git config user.email "sportclubcolico@gmail.com"
          git add data/scd-dirigenza-radar.snapshot.json
          git commit -m "data: refresh direction radar discovery"
          git push
