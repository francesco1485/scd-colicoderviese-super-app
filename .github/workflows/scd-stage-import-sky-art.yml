name: SCD Original Sky Art Staging Import
on:
  push:
    branches: [fix/vision-2026-lovable-recovery-20261009]
    paths:
      - '.github/workflows/scd-stage-import-sky-art.yml'
permissions:
  contents: write
jobs:
  import-original-art:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch 200px crop of original Sky pose from user-owned Canva
        env:
          SOURCE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:190/quality:100/uri:ifs%3A%2F%2FM%2F7f3ff3ea-cd67-4376-848d-97daf3b77109/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH4m4ASlBtI9Y2Ep4x7DYFPWRF-30gkEAbmLTDpHRvc-&exp=1791566030&osig=AAAAAAAAAAAAAAAAAAAAAFWvkV05riqsrHCzgT6Hkj95Wp7xcLt62rAoyuBqgYUg&signer=media-rpc&token=AAIAAU0AJDdmM2ZmM2VhLWNkNjctNDM3Ni04NDhkLTk3ZGFmM2I3NzEwOQAAAAABoSGoJLC8GfXR72g6h2toCxpPu4jlmfvEGhKdP9FU8NYATsEHOA&x-canva-quality=thumbnail"
        run: |
          mkdir -p staging/lovable-vision-2026/public/assets
          curl --fail --location --retry 2 --silent --show-error "$SOURCE_URL" -o staging/lovable-vision-2026/public/assets/sky-dalla-tavola.png
          python - <<'PY'
          import pathlib, struct
          p=pathlib.Path('staging/lovable-vision-2026/public/assets/sky-dalla-tavola.png')
          b=p.read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n', 'Missing PNG'
          w,h=struct.unpack('>II',b[16:24])
          assert w>=150 and h>=150, f'Image is too small: {w}x{h}'
          print('Original Sky pose from approved board recovered:',w,h,len(b))
          PY
      - name: Save isolated graphical asset in source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/lovable-vision-2026/public/assets/sky-dalla-tavola.png
          git commit -m "asset(vision): import user-approved Sky pose crop for isolated visual QA"
          git push origin HEAD:refs/heads/fix/vision-2026-lovable-recovery-20261009
