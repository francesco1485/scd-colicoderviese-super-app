name: SCD Manifest PR Policy

on:
  pull_request:
    branches: ["main"]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate manifest impact declaration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const body=event.pull_request?.body||'';
          const fail=(m)=>{console.error('SCD PR POLICY FAIL: '+m);process.exitCode=1};

          if(!body.includes('- [x] Ho eseguito `SCD:STATE` prima della prima scrittura e non sto usando stato storico come stato corrente.')) fail('SCD:STATE checkbox not confirmed');
          if(!/STATE_STATUS:\s*VERIFIED/i.test(body)) fail('STATE_STATUS must be VERIFIED');
          if(!/MAIN_SHA:\s*[0-9a-f]{40}/i.test(body)) fail('verified MAIN_SHA missing');
          if(!/WORKING_BRANCH:\s*\S+/i.test(body)) fail('working branch missing');
          if(!/MANIFEST_VERSION:\s*\d+\.\d+\.\d+/i.test(body)) fail('manifest version missing');
          if(!/DEPENDENCIES:\s*\S+/i.test(body)) fail('dependency declaration missing');
          if(!/SAFE_NEXT_ACTION:\s*\S+/i.test(body)) fail('safe next action missing');

          if(!body.includes('- [x] Ho letto `SCD_SYSTEM_MANIFEST.json`.')) fail('manifest read checkbox not confirmed');
          if(!/CAP-[A-Z0-9-]+/.test(body)) fail('declare at least one CAP-* capability or CAP-NONE');
          if(!/(R20|SCD_DRIVE|SCD_GMAIL|CORE_SHEET|TESSERATI_SHEET|PULMINI_SHEET|SPONSOR_SHEET|MAIL_OPERATIONS_SHEET|SPONSOR_MASTER_SHEET|ECONOMIC_MASTER_SHEET|TOURNAMENTS_MASTER_SHEET|FIGC|LND|CR_LOMBARDIA|SGS|SPORT_E_SALUTE|RASD|TUTTOCAMPO|SCD_OFFICIAL_SITE|SCD_FACEBOOK|SCD_INSTAGRAM|SCD_TIKTOK|SCD_YOUTUBE|SCD_PIXELLOT|LECCO_CHANNEL|SPRINT_E_SPORT_LOMBARDIA|SCD_ORGANIGRAMMA_2026_27|TUTTITALIA|SEGRETARIO_CALCIO|TEAMSYSTEM_SPORTIVI_IN_CLOUD|SQUBY|ATHLETIS|WEB_VERIFIED|SOURCE-NONE)/.test(body)) fail('declare at least one registered source id or SOURCE-NONE');
          const noContract=body.includes('- [x] Nessuna modifica contrattuale: il manifest non richiede aggiornamento.');
          const changed=body.includes('- [x] Modifica contrattuale: `SCD_SYSTEM_MANIFEST.json` è aggiornato in questo PR.');
          if(noContract===changed) fail('check exactly one Manifest impact option');

          if(!body.includes('### Release evidence')) fail('release evidence section missing');
          for(const label of ['VERSION:','COMMIT:','PR:','CI STATUS:','SCREENSHOT MOBILE:','SCREENSHOT DESKTOP:','DATA SOURCES:','KNOWN LIMITATIONS:']){
            if(!body.includes(label)) fail('release evidence missing '+label);
          }
          if(!body.includes('### Rollback')) fail('rollback section missing');

          if(process.exitCode) process.exit(process.exitCode);
          console.log('SCD PR POLICY PASS');
          NODE
