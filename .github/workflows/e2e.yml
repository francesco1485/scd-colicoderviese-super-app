name: SCD App End-to-End

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: SCD System Manifest gate
        run: npm run test:manifest
      - name: SCD AI portfolio contract gate
        run: npm run test:ai-portfolio
      - name: Supabase Domain Core contract gate
        run: npm run test:supabase-contract
      - name: R57.D1 graph hardening gate
        run: npm run test:r57-d1-graph
      - name: Mobile Supabase contract gate
        run: npm run test:mobile-contract
      - name: Operative Core contract gate
        run: npm run test:operative-core
      - name: Social App contract gate
        run: npm run test:social-app
      - name: R53 football/social core gate
        run: npm run test:r53-core
      - name: R54 private experience gate
        run: npm run test:r54-private
      - name: R55 public content gate
        run: npm run test:r55-content
      - name: CORE R56 fail-closed audit and private desk entry gate
        run: npm run test:core-audit
      - name: R56 identity/calendar/internal gate
        run: npm run test:r56-internal
      - name: R56 identity/calendar core gate
        run: npm run test:r56-core
      - name: R56 calendar fusion gate
        run: npm run test:r56-calendar
      - name: SCD Universe contract gate
        run: npm run test:universe-contract
      - name: Human OS contract gate
        run: npm run test:human-os-contract
      - name: Public calendar privacy and ID projection gate
        run: node --test tests/public-calendar-projection.test.mjs
      - name: Weekly sport & AI newsroom contract gate
        run: npm run test:newsroom-contract
      - name: NextGen synthetic contract gate
        run: npm run test:nextgen-contract
      - name: Asset integrity & adaptive experience gate
        run: npm run test:asset-adaptive-contract
      - name: Intake Hub contract gate
        run: npm run test:intake-contract
      - name: Intake signed link security gate
        run: npm run test:intake-links
      - name: R20 canonical workbook routing regression gate
        run: npm run test:r20-routing
      - name: Three-app ONE / GROW / CORE integration gate
        run: npm run test:cross-app
      - name: Shared SKY grounded assistant permission gate
        run: npm run test:sky-shared
      - name: Sponsor lead workflow and HTTP integration gate
        run: npm run test:grow-leads
      - name: Sponsor CRM and communication contract gate
        run: npm run test:crm-communication
      - name: Sponsor vision contract gate
        run: npm run test:sponsor-vision
      - name: Sponsor LED production contract gate
        run: npm run test:led-production
      - name: Sponsor design system contract gate
        run: npm run test:design-system
      - name: Community benefit contract gate
        run: npm run test:community-benefit
      - name: Sponsor runtime smoke gate
        run: npm run test:sponsor-runtime
      - name: Syntax check
        run: |
          node --check app.js
          node --check app-r24-router.js
          node --check server.js
          node --check scripts/verify-production.mjs
          node --check scripts/verify-r20-direct.mjs
          node --check scripts/validate-ai-portfolio.mjs
          node --check scripts/validate-supabase-contract.mjs
          node --check scripts/validate-mobile-contract.mjs
          node --check scripts/validate-universe-contract.mjs
          node --check scripts/validate-human-os-contract.mjs
          node --check scripts/validate-newsroom-contract.mjs
          node --check scripts/validate-nextgen-contract.mjs
          node --check scripts/validate-asset-adaptive-contract.mjs
          node --check scripts/validate-intake-contract.mjs
          node --check intake/intake.js
          node --check intake/admin.js
          node --check lib/intake-links.js
          node --check lib/scd-operative-engine.js
          node --check scripts/validate-intake-link-factory.mjs
          node --check scripts/validate-operative-core.mjs
          node --check scripts/validate-social-app.mjs
          node --check scripts/validate-r53-core.mjs
          node --check scripts/validate-r54-private.mjs
          node --check scripts/validate-r55-content.mjs
          node --check scripts/validate-r56-internal.mjs
          node --check scripts/validate-r56-core.mjs
          node --check tests/calendar-fusion-contract.mjs
          node --check lib/scd-calendar-fusion.js
          node --check scd-ng.js
          node --check scd-interactions.js
          node --check scd-experience-engine.js
          node --check scd-adaptive-engine.js
          node --check scd-meta-engine.js
          node --check scd-twin.js
      - name: API contract gate
        run: npm run test:contract
      - name: Upstream resilience gate
        run: npm run test:resilience
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build exact Pages artifact
        run: npm run build:pages
      - name: Start SCD server from Pages artifact
        run: |
          SCD_STATIC_DIR=_site npm start > /tmp/scd-server.log 2>&1 &
          echo $! > /tmp/scd-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scd-server.log
          exit 1
      - name: Smoke test mobile app
        run: npm run test:smoke
      - name: Server logs
        if: always()
        run: cat /tmp/scd-server.log || true
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scd-r24-runtime-visual-qa
          path: test-output/*
          if-no-files-found: ignore
          retention-days: 14
