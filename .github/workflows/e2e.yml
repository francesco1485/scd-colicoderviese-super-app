name: SCD App End-to-End

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Syntax check
        run: |
          node --check app.js
          node --check server.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start SCD server
        run: |
          npm start > /tmp/scd-server.log 2>&1 &
          echo $! > /tmp/scd-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scd-server.log
          exit 1
      - name: Smoke test mobile app
        run: npm run test:smoke
      - name: Server logs
        if: always()
        run: cat /tmp/scd-server.log || true
