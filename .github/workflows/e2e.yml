name: SCD App End-to-End

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: SCD System Manifest gate
        run: npm run test:manifest
      - name: Supabase Domain Core contract gate
        run: npm run test:supabase-contract
      - name: Mobile Supabase contract gate
        run: npm run test:mobile-contract
      - name: SCD Universe contract gate
        run: npm run test:universe-contract
      - name: Human OS contract gate
        run: npm run test:human-os-contract
      - name: Weekly sport & AI newsroom contract gate
        run: npm run test:newsroom-contract
      - name: NextGen synthetic contract gate
        run: npm run test:nextgen-contract
      - name: Asset integrity & adaptive experience gate
        run: npm run test:asset-adaptive-contract
      - name: Intake Hub contract gate
        run: npm run test:intake-contract
      - name: Intake signed link security gate
        run: npm run test:intake-links
      - name: Sponsor operations contract gate
        run: npm run test:sponsor-operations
      - name: Syntax check
        run: |
          node --check app.js
          node --check app-r24-router.js
          node --check server.js
          node --check scripts/verify-production.mjs
          node --check scripts/verify-r20-direct.mjs
          node --check scripts/validate-supabase-contract.mjs
          node --check scripts/validate-mobile-contract.mjs
          node --check scripts/validate-universe-contract.mjs
          node --check scripts/validate-human-os-contract.mjs
          node --check scripts/validate-newsroom-contract.mjs
          node --check scripts/validate-nextgen-contract.mjs
          node --check scripts/validate-asset-adaptive-contract.mjs
          node --check scripts/validate-intake-contract.mjs
          node --check intake/intake.js
          node --check intake/admin.js
          node --check lib/intake-links.js
          node --check scripts/validate-intake-link-factory.mjs
          node --check scd-ng.js
          node --check scd-interactions.js
          node --check scd-experience-engine.js
          node --check scd-adaptive-engine.js
          node --check scd-meta-engine.js
          node --check scd-twin.js
          node --check sponsor/app.js
          node --check scripts/validate-sponsor-operations.mjs
      - name: API contract gate
        run: npm run test:contract
      - name: Upstream resilience gate
        run: npm run test:resilience
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build exact Pages artifact
        run: npm run build:pages
      - name: Start SCD server from Pages artifact
        run: |
          SCD_STATIC_DIR=_site npm start > /tmp/scd-server.log 2>&1 &
          echo $! > /tmp/scd-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scd-server.log
          exit 1
      - name: Smoke test mobile app
        run: npm run test:smoke
      - name: Server logs
        if: always()
        run: cat /tmp/scd-server.log || true
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scd-r24-runtime-visual-qa
          path: test-output/*.png
          if-no-files-found: ignore
          retention-days: 14
