name: SCD Sync tools (calendar converter + Iride outcomes)

on:
  pull_request:
    branches: ["main", "staging/superapp"]
    paths: ["tools/sync/**", ".github/workflows/sync-tools.yml"]
  push:
    branches: ["staging/superapp"]
    paths: ["tools/sync/**", ".github/workflows/sync-tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl (same pin as the hourly task)
        run: pip install "openpyxl==3.1.5"
      - name: Self-tests used by the hourly task
        run: |
          python3 -I -B tools/sync/calendar_public_payload.py --self-test
          python3 -I -B tools/sync/apply_iride_outcomes.py --self-test
      - name: Unit tests
        run: python3 -B -m unittest discover -s tools/sync -p "test_*.py" -v
