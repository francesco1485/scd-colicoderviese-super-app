name: SCD Three-Worlds Staging QA
on:
  push:
    branches:
      - feat/content-first-three-app-integration-20261008
    paths:
      - 'scd-one-native.js'
      - 'scd-one-native.css'
      - 'scd-three-worlds-native.js'
      - 'scd-three-worlds-native.css'
      - 'scd-ng.js'
      - 'index.html'
      - 'scripts/build-pages.mjs'
      - 'SCD_SYSTEM_MANIFEST.json'
      - 'staging/lovable-vision-2026/scripts/browser-three-worlds.mjs'
      - 'staging/lovable-vision-2026/scripts/browser-native-one.mjs'
      - '.github/workflows/scd-three-worlds-stage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app and data contracts
        run: |
          node --check scd-ng.js
          node --check scd-one-native.js
          node --check scd-three-worlds-native.js
          npm run test:manifest
          node --test tests/public-calendar-projection.test.mjs
          node --test tests/scd-native-router-selector.test.mjs
      - name: Build static runtime
        run: npm run build:pages
      - name: Set up visual QA
        working-directory: staging/lovable-vision-2026
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start canonical isolated Node API
        run: |
          PORT=4177 node server.js > /tmp/scd-qa-stage.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4177/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4177/health > /dev/null
      - name: Verify authentic SCD ONE Home and Calendar
        working-directory: staging/lovable-vision-2026
        env:
          SCD_BASE_URL: http://127.0.0.1:4177
        run: node scripts/browser-native-one.mjs
      - name: Verify CORE and GROW real routes on mobile and desktop
        working-directory: staging/lovable-vision-2026
        env:
          SCD_BASE_URL: http://127.0.0.1:4177
        run: node scripts/browser-three-worlds.mjs
      - name: Attach real browser screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCD-COLICODERVIESE-ONE-CORE-GROW-BROWSER-STAGING
          path: |
            staging/lovable-vision-2026/test-output/scd-one-native-*.png
            staging/lovable-vision-2026/test-output/SCD-three-worlds-*.png
          if-no-files-found: ignore
