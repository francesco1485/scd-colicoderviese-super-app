name: SCD Three-Worlds Integration QA
on:
  push:
    branches:
      - fix/vision-2026-lovable-recovery-20261009
    paths:
      - 'scd-three-worlds-native.js'
      - 'scd-three-worlds-native.css'
      - 'index.html'
      - 'scripts/build-pages.mjs'
      - 'SCD_SYSTEM_MANIFEST.json'
      - 'staging/lovable-vision-2026/scripts/browser-three-worlds.mjs'
      - '.github/workflows/scd-three-worlds-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-worlds-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and governance
        run: |
          node --check scd-ng.js
          node --check scd-one-native.js
          node --check scd-three-worlds-native.js
          npm run test:manifest
          node --test tests/public-calendar-projection.test.mjs
          node --test tests/scd-native-router-selector.test.mjs
      - name: Build production-compatible static root output (not deployed)
        run: npm run build:pages
      - name: Install existing QA dependencies
        working-directory: staging/lovable-vision-2026
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: staging/lovable-vision-2026
        run: npx playwright install --with-deps chromium
      - name: Run existing canonical Node server on isolated CI port
        run: |
          PORT=4177 node server.js > /tmp/scd-three-worlds-server.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4177/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4177/health > /dev/null
      - name: Test real three-world navigation on mobile and desktop
        working-directory: staging/lovable-vision-2026
        env:
          SCD_BASE_URL: http://127.0.0.1:4177
        run: node scripts/browser-three-worlds.mjs
      - name: Preserve original-size browser screenshots as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scd-three-worlds-browser-2026
          path: staging/lovable-vision-2026/test-output/SCD-three-worlds-*.png
          if-no-files-found: ignore
