name: SCD Command Platform

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/command-platform.yml'
  push:
    branches: [ main ]
    paths:
      - 'platform/**'
      - '.github/workflows/command-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package.json
      - name: Install platform dependencies
        run: npm install --prefix platform --no-audit --no-fund
      - name: TypeScript build and tests
        run: npm run check --prefix platform
