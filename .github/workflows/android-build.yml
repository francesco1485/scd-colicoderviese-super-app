name: Build Android Play Bundle

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "assets/icon-512.png"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK and release AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scd-colicoderviese-android-v1
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
